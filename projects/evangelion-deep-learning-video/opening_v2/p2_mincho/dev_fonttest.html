<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/fonts/fonts_v2.css"></head>
<body style="margin:0;background:#000"><canvas id="c" width="1400" height="900"></canvas>
<script>
window.READY = (async () => {
  const fams = ['700 60px "Roboto Condensed"', '700 60px "Cinzel"', 'italic 500 60px "EB Garamond"', '900 60px "Zen Old Mincho"', '700 60px "Barlow Condensed"'];
  await Promise.all(fams.map((f) => document.fonts.load(f, 'ABC')));
  const c = document.getElementById('c').getContext('2d');
  c.fillStyle = '#fff'; let y = 90;
  for (const f of ['700 80px "Roboto Condensed"', '700 80px Roboto Condensed', '700 80px "Liberation Sans Narrow"', '700 80px "Cinzel"', 'italic 500 80px "EB Garamond"', '900 80px "Zen Old Mincho"', 'bold 80px "Roboto Condensed", sans-serif', '700 80px "Liberation Sans"']) { c.font = f; if (y > 400) c.letterSpacing = '0px'; c.fillText('TEST SET OUTLIERS 01 ' + f.slice(0, 22), 20, y); y += 105; }
  return 1;
})();
</script></body></html>
